[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "VideoXAgent"
version = "0.1.0"
description = "Online Video Agent Harness for Long Video Understanding"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Boqiang Duan", email = "firestonelib@gmail.com" },
    { name = "Sen Yang", email = "yangsenius@gmail.com" }
]
keywords = ["agents", "mllm", "long-video-understanding", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

# Agent and lightweight shared runtime. install_profiles.sh installs this project
# and requirements/profiles/base.txt together into .venvs/base. Heavy MCP model
# stacks use separate profile environments.
dependencies = [
    "anyio>=4.0.0,<5",
    "mcp>=1.26.0,<2",
    "numpy>=1.26.0,<3",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0.0,<7",
    "requests>=2.28.0",
    "httpx>=0.28.0,<1",
    "deepagents>=0.5.0,<0.6",
    "deepagents-cli>=0.0.37,<0.1",
    "langchain>=1.2.0,<2",
    "langchain-anthropic>=1.4.0,<2",
    "langchain-google-genai>=4.2.0,<5",
    "langchain-openai>=1.1.0,<2",
    "rich>=14.0.0,<15",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
dev = [
    "build>=1.0.3",
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
evaluation = [
    "pandas>=2.0.0",
    "pyarrow>=10.0.0",
    "matplotlib",
]

[tool.hatch.build]

[tool.hatch.build.targets.wheel]
packages = ["_base"]
output-dir = "output/dist"

[tool.hatch.build.targets.sdist]
include = [
    "/_base",
    "/_tool_defs",
    "/tools",
    "/requirements",
    "/scripts/download_models.sh",
    "/scripts/install_profiles.sh",
    "/scripts/configure_mcp_profiles.py",
    "/scripts/tool_catalog.py",
    "/scripts/mcp_runtime.py",
    "/scripts/verify_profile.py",
    "/install.md",
    "/install_deepagents.md",
    "/MODEL_SETUP.md",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
output-dir = "output/dist"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
