# Minimal configuration for a single-video Agent run from the repository root.
# Replace the model IDs and example URLs with your provider's values.
# Put LLM_API_KEY and VLM_API_KEY in the local key.yaml file, not this file.

model:
  provider: "ChatOpenAI"
  model: "YOUR_LLM_MODEL"
  base_url: "https://your-llm-provider.example/v1"
  max_retries: 1
  timeout: 60

# The VLM model must support image inputs through a chat-completions API.
# Existing VLM values in each MCP server's env take precedence over these values.
vlm_model_name: "YOUR_VLM_MODEL"
VLM_API_URL: "https://your-vlm-provider.example/v1"


# Generated by scripts/install_profiles.sh; enable only the servers you need.
mcp_json_file: ".mcp.profiles.json"
