# Historical source-derived example; not an exact paper reproduction.
# Source: LVideoXAgent/exp_configs/videomme_exp_long_opus.yaml.
# Edit the endpoint and model placeholders before running.
exp_name: videomme_long_claude_example

model:
  provider: ChatAnthropic
  # The source deployment alias is normalized to the public model name.
  model: claude-opus-4-6
  base_url: https://your-llm-provider.example
  temperature: 0.0
  max_retries: 10

# The source did not specify a VLM; choose one supported by your endpoint.
vlm_model_name: YOUR_VLM_MODEL
VLM_API_URL: https://your-vlm-provider.example/v1
mcp_json_file: .mcp.profiles.json

disabled_builtin_tools:
  - read_file
  - write_file
  - edit_file
  - execute
  - task
  - ls

# Start with one sample; raise these limits for a full experiment.
workers: 1
max_samples: 1
sample_rate: 1
skip_completed: true
system_prompt_file: SYSTEM_PROMPT.md
data_files:
  - path: data/videomme/test/long_duration_data.jsonl
    # The source used a fixed 150-question subset. To select your local subset:
    # qid_file: data/sampled_qids/videomme_long_duration_data_sampled_150.txt
